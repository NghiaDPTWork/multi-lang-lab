<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500" />
      <stop offset="50%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
  </defs>
  <!-- Enlarge Main Star (stretching from 5 to 95 to maximize size) -->
  <path d="M 50 5 Q 50 50 5 50 Q 50 50 50 95 Q 50 50 95 50 Q 50 50 50 5 Z" fill="url(#star-grad)" />
  <!-- Small Star placed closely and scaled up slightly -->
  <path d="M 80 15 Q 80 25 70 25 Q 80 25 80 35 Q 80 25 90 25 Q 80 25 80 15 Z" fill="url(#star-grad)" opacity="0.9" />
</svg>