<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Validate Form</title>
    <!-- Css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5" style="max-width: 600px">
      <h1 class="text-center text-info mb-4">Dự án: Validate Form</h1>

      <form novalidate class="shadow p-4 rounded bg-light">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" placeholder="name@example.com" />
        </div>

        <div class="mb-3">
          <label for="name" class="form-label">Họ và Tên</label>
          <input id="name" type="text" class="form-control" placeholder="Nguyễn Văn A" />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Mật khẩu</label>
          <input id="password" type="password" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="confirmedPassword" class="form-label">Xác nhận mật khẩu</label>
          <input id="confirmedPassword" type="password" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Đăng ký</button>
      </form>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./ProjectValidateForm.js"></script>
  </body>
</html>
